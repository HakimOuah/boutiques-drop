version: "3.8"
services:
  app:
    build: .
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dropshipping
      POSTGRES_PASSWORD: dropshipping
      POSTGRES_DB: dropshipping
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
volumes:
  pgdata:
